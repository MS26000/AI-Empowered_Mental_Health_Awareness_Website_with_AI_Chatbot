<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wellness Check-in Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --muted:#94a3b8; --text:#e5e7eb;
      --adaptive-accent:#8b5cf6; --adaptive-glow:rgba(139,92,246,.25);
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:Inter,system-ui,sans-serif; color:var(--text);
      background:radial-gradient(1200px 600px at 80% -10%, var(--adaptive-glow), transparent 50%), var(--bg);
      transition: background .6s ease;}
    .container{max-width:640px; margin:32px auto; padding:0 16px}
    h1{font-size:26px}
    .sub{color:var(--muted); font-size:14px; margin-bottom:16px}
    #adaptiveBanner{display:none; font-size:13px; color:var(--adaptive-accent); margin-bottom:16px; padding:8px 12px; border:1px solid var(--adaptive-accent); border-radius:10px; background:var(--adaptive-glow)}
    .panel{background:var(--panel); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:18px; margin-bottom:14px}
    .question{font-weight:600; margin-bottom:10px}
    .option{display:block; padding:10px 12px; border:1px solid rgba(255,255,255,.08); border-radius:10px; margin-bottom:8px; cursor:pointer}
    .option:hover{border-color:var(--adaptive-accent)}
    .option input{margin-right:8px}
    .btn{appearance:none; border:1px solid rgba(255,255,255,.1); background:var(--adaptive-accent); color:white; padding:10px 16px; border-radius:12px; font-weight:600; cursor:pointer}
    .result-box{display:none; text-align:center}
    .result-box h2{margin-bottom:6px}
    .disclaimer{font-size:12px; color:var(--muted); margin-top:10px}
    a.back{color:var(--adaptive-accent); font-size:13px; text-decoration:none}
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="mood.html">&larr; Back to mood tracker</a>
    <h1>Weekly Wellness Check-in</h1>
    <div class="sub">A quick self-reflection - not a clinical diagnosis.</div>
    <div id="adaptiveBanner"></div>

    <div id="quizForm"></div>
    <button class="btn" id="submitBtn" style="margin-top:10px">Submit</button>

    <div class="panel result-box" id="resultBox">
      <h2 id="resultBand"></h2>
      <div class="muted" id="resultScore"></div>
      <div class="disclaimer" id="resultDisclaimer"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/adaptive-ui.js"></script>
  <script>
    if (!window.MindAuth.isLoggedIn()) {
      window.location.href = "login.html";
    }

    const QUIZ_ID = 1;
    const quizForm = document.getElementById('quizForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultBox = document.getElementById('resultBox');

    async function loadQuiz() {
      const data = await window.MindAuth.getQuiz(QUIZ_ID);
      if (data.error || !data.questions) {
        quizForm.innerHTML = `<div class="panel">Could not load the quiz. Make sure quiz data has been seeded in the database.</div>`;
        submitBtn.style.display = 'none';
        return;
      }

      data.questions.forEach(q => {
        const div = document.createElement('div');
        div.className = 'panel';
        div.innerHTML = `<div class="question">${q.question_text}</div>`;
        q.options.forEach(opt => {
          const label = document.createElement('label');
          label.className = 'option';
          label.innerHTML = `<input type="radio" name="q${q.id}" value="${opt.id}"> ${opt.option_text}`;
          div.appendChild(label);
        });
        quizForm.appendChild(div);
      });
    }

    submitBtn.onclick = async () => {
      const selected = [];
      const groups = new Set(Array.from(quizForm.querySelectorAll('input[type=radio]')).map(i => i.name));
      for (const g of groups) {
        const checked = quizForm.querySelector(`input[name="${g}"]:checked`);
        if (!checked) { alert('Please answer every question.'); return; }
        selected.push(parseInt(checked.value));
      }

      submitBtn.disabled = true;
      const { ok, data } = await window.MindAuth.submitQuiz(QUIZ_ID, selected);
      submitBtn.disabled = false;

      if (!ok) { alert(data.detail || 'Something went wrong.'); return; }

      quizForm.style.display = 'none';
      submitBtn.style.display = 'none';
      resultBox.style.display = 'block';
      document.getElementById('resultBand').textContent = data.result_band;
      document.getElementById('resultScore').textContent = `Score: ${data.total_score} / ${data.max_possible}`;
      document.getElementById('resultDisclaimer').textContent = data.disclaimer;
    };

    loadQuiz();
    window.AdaptiveUI.apply();
  </script>
</body>
</html>
